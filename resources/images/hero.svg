<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" preserveAspectRatio="xMidYMid slice" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a5c"/>
      <stop offset="0.45" stop-color="#1f5f86"/>
      <stop offset="1" stop-color="#0e2c47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#3da3c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e2c47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c80a8"/>
      <stop offset="1" stop-color="#10324f"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="430" fill="url(#sky)"/>
  <rect width="1400" height="430" fill="url(#glow)"/>

  <!-- light rays -->
  <g opacity="0.18" fill="#bfe6f5">
    <polygon points="620,0 660,0 540,430 470,430"/>
    <polygon points="760,0 800,0 880,430 820,430"/>
    <polygon points="690,0 715,0 705,430 670,430"/>
  </g>

  <!-- ocean waves -->
  <path d="M0,300 C220,255 360,330 620,300 C880,270 1040,335 1400,295 L1400,430 L0,430 Z" fill="url(#wave)" opacity="0.9"/>
  <path d="M0,340 C260,305 420,365 700,338 C980,312 1140,372 1400,340 L1400,430 L0,430 Z" fill="#0c2940" opacity="0.85"/>

  <!-- bubbles -->
  <g fill="#bfe6f5" opacity="0.35">
    <circle cx="300" cy="150" r="4"/><circle cx="340" cy="120" r="2.5"/>
    <circle cx="1080" cy="170" r="5"/><circle cx="1120" cy="140" r="3"/>
    <circle cx="980" cy="90" r="2.5"/><circle cx="430" cy="90" r="3"/>
  </g>

  <!-- title -->
  <text x="170" y="235" fill="#eaf6ff" font-size="30" font-weight="800" letter-spacing="6" opacity="0.92">ОКЕАН ЗОВЕТ</text>
  <text x="700" y="248" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="18" text-anchor="middle">АКВАМЕН</text>
  <text x="1010" y="230" fill="#cfe9f7" font-size="15" font-weight="600" letter-spacing="1.5">СМОТРИТЕ В 3D и IMAX 3D</text>
  <text x="1010" y="258" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="2">С 13 ДЕКАБРЯ</text>

  <!-- age rating -->
  <circle cx="1340" cy="60" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1340" y="67" fill="#ffffff" fill-opacity="0.8" font-size="18" font-weight="700" text-anchor="middle">12+</text>
</svg>
